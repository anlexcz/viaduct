<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moje železnice 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{color-scheme:dark;--bg:#090c10;--panel:#0f141a;--text:#f4f6f8;--muted:#8b96a3;--border:#222a33;--accent:#87cefa}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif}.shell{display:grid;grid-template-columns:330px 1fr;min-height:100vh}.side{position:relative;z-index:500;padding:34px 28px;border-right:1px solid var(--border);background:rgba(15,20,26,.97)}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}h1{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:.95;letter-spacing:.02em;margin:10px 0 12px}.sub,.note{color:var(--muted);line-height:1.55}.sub{font-size:13px;margin-bottom:28px}.stat{padding:16px 0;border-top:1px solid var(--border)}.stat strong{display:block;font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.legend{margin-top:24px}.legend-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:10px}.legend-row{display:flex;align-items:center;gap:10px;margin:10px 0;color:var(--muted);font-size:12px}.sw{height:3px;width:44px}.note{font-size:11px;margin-top:28px;padding-top:16px;border-top:1px solid var(--border)}#map{min-height:100vh}.leaflet-container{background:#080b0f}.leaflet-control-attribution{font-size:9px!important;background:rgba(9,12,16,.8)!important;color:#68727e!important}.leaflet-control-attribution a{color:#8794a2!important}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--border);padding:24px}h1{font-size:38px}#map{min-height:68vh}}
</style></head><body><div class="shell"><aside class="side"><div class="eyebrow">Anlex · Viaduct data</div><h1>Moje železnice<br>2026</h1><div class="sub">Mapa intenzity železničních jízd. Čím výraznější úsek, tím častěji jsem po něm v roce 2026 jel.</div><div class="stat"><strong id="trips">–</strong><span>jízd v datasetu</span></div><div class="stat"><strong id="segments">–</strong><span>normalizovaných úseků</span></div><div class="stat"><strong id="maximum">–</strong><span>maximum průjezdů</span></div><div class="legend"><div class="legend-title">Intenzita</div><div class="legend-row"><span class="sw" style="background:#34414d"></span>1×</div><div class="legend-row"><span class="sw" style="background:#527f98"></span>2–3×</div><div class="legend-row"><span class="sw" style="background:#87cefa"></span>4–9×</div><div class="legend-row"><span class="sw" style="background:#d7f1ff;height:5px"></span>10× a více</div></div><div class="note" id="mode">Načítám data…</div></aside><main id="map"></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="data/segments.js"></script><script>
const map=L.map('map',{preferCanvas:true,zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors',opacity:.27}).addTo(map);const bounds=[];
function color(n){return n>=10?'#d7f1ff':n>=4?'#87cefa':n>=2?'#527f98':'#34414d'}function opacity(n){return n>=10?1:n>=4?.92:n>=2?.72:.46}function width(n){return n>=10?4.2:n>=4?3.2:n>=2?2.4:1.6}function draw(a,b,n){L.polyline([a,b],{color:color(n),weight:width(n),opacity:opacity(n),lineCap:'round',interactive:n>=2}).bindTooltip(`${n}× projeté`,{sticky:true}).addTo(map);bounds.push(a,b)}
const d=window.VIADUCT_DATA||{},segs=d.segments||[];for(const s of segs){if(Array.isArray(s))draw([s[0],s[1]],[s[2],s[3]],s[4]);else draw(s.a,s.b,s.count)}trips.textContent=(d.tripCount||0).toLocaleString('cs-CZ');segments.textContent=(d.segmentCount||segs.length).toLocaleString('cs-CZ');maximum.textContent=(d.maxCount||0)+'×';mode.textContent=`GPX geometrie · ${d.trackSegmentCount||0} trkseg · mřížka ${d.cellMeters||120} m · odmítnuté skoky ${d.rejectedLinks||0}. Nejde zatím o map-matching na kanonickou železniční síť.`;if(bounds.length)map.fitBounds(bounds,{padding:[22,22]});else map.setView([49.8,15.5],7);
</script></body></html>
