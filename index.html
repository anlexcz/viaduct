<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viaduct — železniční heatmapa</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{color-scheme:dark;--bg:#0c0f14;--panel:#141922;--text:#f4f7fb;--muted:#98a2b3;--border:#252d3a;--accent:#84d1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.shell{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.side{padding:28px 24px;border-right:1px solid var(--border);background:var(--panel)}h1{font-size:26px;margin:0 0 8px}.sub,.note{color:var(--muted);line-height:1.5}.sub{margin-bottom:24px}.stat{padding:15px 0;border-top:1px solid var(--border)}.stat strong{display:block;font-size:28px}.stat span{color:var(--muted);font-size:13px}.legend{margin-top:22px}.legend-row{display:flex;align-items:center;gap:10px;margin:9px 0;color:var(--muted);font-size:13px}.sw{height:5px;width:42px;border-radius:99px}.note{font-size:12px;margin-top:26px}#map{min-height:100vh}.leaflet-container{background:#0b1017}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--border)}#map{min-height:70vh}}
</style></head><body><div class="shell"><aside class="side"><h1>Moje železnice 2026</h1><div class="sub">Heatmapa projetých tras. Opakované jízdy se sčítají a podezřelé skoky v geometrii se nezobrazují.</div><div class="stat"><strong id="trips">–</strong><span>jízd v datasetu</span></div><div class="stat"><strong id="segments">–</strong><span>vykreslených úseků</span></div><div class="stat"><strong id="maximum">–</strong><span>nejvyšší intenzita</span></div><div class="legend"><div class="legend-row"><span class="sw" style="background:#314252"></span>1×</div><div class="legend-row"><span class="sw" style="background:#4e8da8"></span>2–3×</div><div class="legend-row"><span class="sw" style="background:#84d1ff"></span>4× a více</div></div><div class="note" id="mode">Načítám data…</div></aside><main id="map"></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="data/trips.js"></script><script src="data/segments.js"></script><script>
const map=L.map('map',{preferCanvas:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const bounds=[];
function color(n){return n>=4?'#84d1ff':n>=2?'#4e8da8':'#314252'}function opacity(n){return n>=4?.95:n>=2?.78:.52}function draw(a,b,n){L.polyline([a,b],{color:color(n),weight:2+Math.min(n,6)*.65,opacity:opacity(n),lineCap:'round'}).bindTooltip(`${n}× projeté`).addTo(map);bounds.push(a,b)}function km(a,b){const r=Math.PI/180,dLat=(b[0]-a[0])*r,dLon=(b[1]-a[1])*r,x=dLon*Math.cos((a[0]+b[0])*r/2),y=dLat;return 6371*Math.sqrt(x*x+y*y)}
let d=window.VIADUCT_DATA||{};let segs=d.segments||[];let tripCount=d.tripCount||0,maxCount=d.maxCount||0;
if(segs.length){for(const s of segs)draw(s.a,s.b,s.count);mode.textContent=`Segmentová data · mřížka ${d.cellMeters||120} m · odmítnuté skoky: ${d.rejectedLinks||0}`}
else{const ts=window.VIADUCT_TRIPS||[];let drawn=0;for(const t of ts){const n=Math.max(1,Number(t.weight)||1),p=t.points||[];tripCount+=n;maxCount=Math.max(maxCount,n);for(let i=1;i<p.length;i++){if(km(p[i-1],p[i])<=1.5){draw(p[i-1],p[i],n);drawn++}}}segs={length:drawn};mode.textContent='Náhradní režim z GPX geometrií · spojnice delší než 1,5 km jsou zahazovány.'}
trips.textContent=tripCount.toLocaleString('cs-CZ');segments.textContent=segs.length.toLocaleString('cs-CZ');maximum.textContent=maxCount+'×';if(bounds.length)map.fitBounds(bounds,{padding:[24,24]});else map.setView([49.8,15.5],7);
</script></body></html>
